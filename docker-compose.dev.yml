version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pdf_reader_db_dev
    environment:
      POSTGRES_DB: pdf_reader_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/internal/database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pdf_reader_dev

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pdf_reader_cache_dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pdf_reader_dev

  # Backend API (with hot reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pdf_reader_api_dev
    environment:
      # Server
      PORT: 8080
      ENV: development
      GIN_MODE: debug
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: devpassword
      DB_NAME: pdf_reader_dev
      DB_SSLMODE: disable
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      
      # Storage
      STORAGE_TYPE: local
      STORAGE_PATH: /app/storage
      MAX_FILE_SIZE: 52428800
      
      # Security (relaxed for dev)
      CORS_ORIGINS: "*"
      JWT_SECRET: dev-secret-key
      
      # Features
      ENABLE_CACHE: true
      CACHE_TTL: 3600
      
      # Development
      LOG_LEVEL: debug
      ENABLE_PROFILER: true
    volumes:
      # Mount source code for hot reload
      - ./backend:/app
      # Separate volume for storage
      - pdf_dev_storage:/app/storage
      # Don't mount tmp (air's build directory)
      - /app/tmp
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pdf_reader_dev

  # Frontend (with hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pdf_reader_web_dev
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      # Mount source code for hot reload
      - ./frontend:/app
      # Use node_modules from image
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pdf_reader_dev
    stdin_open: true
    tty: true

volumes:
  postgres_dev_data:
  redis_dev_data:
  pdf_dev_storage:

networks:
  pdf_reader_dev:
    driver: bridge